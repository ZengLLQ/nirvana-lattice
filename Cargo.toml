[package]
name = "nirvana-lattice"
version = "0.1.0"
edition = "2021"
authors = ["ZengLLQ"]
description = "Lattice-based zero-knowledge succinct non-interactive arguments of knowledge (zk-SNARK) over Ring-LWE and Module-LWE with negacyclic NTT polynomial arithmetic in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZengLLQ/nirvana-lattice"
readme = "README.md"
keywords = ["post-quantum", "lattice", "zk-snark", "ring-lwe", "ntt"]
categories = ["cryptography", "algorithms"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
blake3 = "1.5"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "nirvana-lattice"
path = "src/main.rs"

[lib]
name = "nirvana_lattice"
path = "src/lib.rs"
